# Render Blueprint (RAA-28, RAA-42): the Rails API as a free Docker web service, deployed from
# `staging` on every merge — the hosted environment is staging until a production host
# exists (M8); `main` deploys nowhere for now. The web app is on Vercel
# (web/vercel.json), Postgres on Neon and Redis on Upstash; their URLs are secrets entered in
# the Render dashboard (`sync: false`), never committed.
#
# Free tier: the service sleeps when idle — the next request waits for a cold start, Action
# Cable connections drop and Solid Queue jobs (run inside Puma, there is no free worker) pause.
services:
  - type: web
    name: rent-anything-api
    runtime: docker
    plan: free
    region: singapore
    branch: staging
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      # Also passed to the Docker build as a build arg: skips the dev and test gems.
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      # Accept booking requests the moment they are made, until partners answer them in the app
      # (RAA-134 turned the default off). A guest's change to a booking always waits.
      - key: BOOKINGS_AUTO_ACCEPT
        value: "true"
      - key: RAILS_MASTER_KEY
        sync: false
      # Neon, direct (not -pooler) connection strings: PgBouncer's transaction mode breaks
      # the advisory locks migrations take. The primary uses the postgis:// scheme.
      - key: DATABASE_URL
        sync: false
      - key: CACHE_DATABASE_URL
        sync: false
      - key: QUEUE_DATABASE_URL
        sync: false
      # Upstash, rediss:// (TLS).
      - key: REDIS_URL
        sync: false
      # The Vercel URL, e.g. https://tripkonext-staging.vercel.app (no trailing slash).
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      # Didit sandbox application on staging (RAA-44); the webhook destination points at
      # <this service>/api/v1/webhooks/didit.
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      # Listing photos on Cloudflare R2 (RAA-106): the account id, an R2 API token's key pair,
      # the bucket, and the bucket's public URL guests load photos from (no trailing slash).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Active Record Encryption (RAA-145: payout account numbers). Set once from
      # `bin/rails db:encryption:init`; changing them makes the saved numbers unreadable.
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
