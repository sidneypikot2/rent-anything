# The hosted staging environment on one AWS Lightsail instance (RAA-156). It lives at
# /opt/tripkonext/ on the instance; .github/workflows/deploy-staging.yml copies this file and
# the Caddyfile there and runs `docker compose pull && up -d` on every merge into staging.
# Images come from GHCR, built by that workflow — the instance never builds anything.
# Postgres runs here too (RAA-174, after Neon's free tier ran out); Redis (Upstash) is outside.
# Secrets are in backend.env and db.env next to this file on the instance, never in the
# repository. Not .env: the deploy rewrites that one with IMAGE_TAG on every run.
services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The Let's Encrypt certificates: losing them means re-issuing, which is rate limited.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web

  db:
    # The same PostGIS image as the local docker-compose.yml. Only the Compose network
    # reaches it: no ports are published, and the firewall stays 22/80/443.
    image: imresamu/postgis:18-3.6
    restart: unless-stopped
    # POSTGRES_PASSWORD; backend.env's three database URLs use the same password.
    env_file: ./db.env
    environment:
      POSTGRES_USER: postgres
    # Sized for the 1 GB instance it shares with Rails, Next and Caddy. 30 connections is
    # plenty for Puma's 3 threads across the primary, cache and queue databases plus Solid
    # Queue's workers.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      # Staging's data. Losing this volume loses every user, listing and booking; the
      # nightly dump (README) is the way back.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/sidneypikot2/rent-anything-backend:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      # Its own Rails env (RAA-172): config/environments/staging.rb loads production.rb.
      RAILS_ENV: staging
      # The image was built without these gem groups (deploy-staging.yml); Bundler has to be
      # told again at runtime, or it looks for them and Rails won't boot.
      BUNDLE_WITHOUT: development:test
      SOLID_QUEUE_IN_PUMA: "1"
      RAILS_MAX_THREADS: "3"
      # Fewer malloc arenas: keeps Ruby's memory down on the 1 GB instance.
      MALLOC_ARENA_MAX: "2"
      # Accept booking requests the moment they are made, until partners answer them in the
      # app (RAA-134 turned the default off). A guest's change to a booking always waits.
      BOOKINGS_AUTO_ACCEPT: "true"
      # Sentry tags each error with the deployed commit (the DSN is in backend.env).
      SENTRY_RELEASE: ${IMAGE_TAG:-staging}
    healthcheck:
      # assume_ssl in production.rb keeps force_ssl from redirecting this plain-HTTP check.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      # db:prepare runs on boot (bin/docker-entrypoint) and needs the database up.
      db:
        condition: service_healthy

  web:
    image: ghcr.io/sidneypikot2/rent-anything-web:${IMAGE_TAG:-staging}
    restart: unless-stopped
    environment:
      # Server-side rendering reaches the API inside the Compose network.
      API_INTERNAL_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
