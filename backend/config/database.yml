# PostGIS adapter: listings.location and areas.boundary are geography columns.
# The db image (postgis/postgis) ships the extension; the first migration enables it.
default: &default
  adapter: postgis
  encoding: unicode
  schema_search_path: public
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: rent_anything_development

# Erased and re-generated from the schema when the specs run.
test:
  <<: *default
  database: rent_anything_test

# Production (not deployed yet) reads DATABASE_URL, CACHE_DATABASE_URL and QUEUE_DATABASE_URL
# (postgis:// scheme for the primary). Solid Cache and Solid Queue keep their own databases there,
# loaded from db/cache_schema.rb and db/queue_schema.rb.
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    adapter: postgresql
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    adapter: postgresql
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
