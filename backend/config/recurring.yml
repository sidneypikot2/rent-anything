production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Search index and search events (RAA-60).
  refresh_search_terms:
    class: SearchTerms::RefreshJob
    schedule: every day at 3am Asia/Manila
  prune_search_events:
    class: SearchEvents::PruneJob
    schedule: every day at 3:30am Asia/Manila
