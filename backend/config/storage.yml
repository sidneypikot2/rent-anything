test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Listing photos on Cloudflare R2 (RAA-106), through its S3 API. The R2_* values are an R2
# API token's keys and the bucket (backend/.env.example). The bucket is served publicly at
# R2_PUBLIC_URL, which is how guests load photos (ListingPhotos::Urls), not through this API.
cloudflare:
  service: S3
  endpoint: https://<%= ENV["R2_ACCOUNT_ID"] %>.r2.cloudflarestorage.com
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV.fetch("R2_BUCKET", "unset") %>
