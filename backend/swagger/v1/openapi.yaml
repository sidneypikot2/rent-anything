      tags:
      - Partner
      description: 'Partner-only (RAA-115). `active` goes live from a draft, paused
        or delisted listing, and needs everything in `live_blockers` first: there
        is no review. `paused` takes a live listing off for now, `delisted` takes
        a live or paused one off the marketplace. Only active listings reach guests.
        The status it already has changes nothing. Another partner''s listing is a
        404.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: listing_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
