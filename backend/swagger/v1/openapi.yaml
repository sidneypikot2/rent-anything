              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another partner's listing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/partner/payout_accounts":
    get:
      summary: The signed-in partner's payout accounts
      tags:
      - Partner
      description: Partner-only. Where the partner's payouts can go (RAA-145) — bank
        accounts, GCash and Maya — oldest first, each with the businesses paid out
        to it. Only the last four digits of a number are returned.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: only the partner's own accounts, with the businesses that use
            them
          content:
            application/json:
              schema:
                type: array
