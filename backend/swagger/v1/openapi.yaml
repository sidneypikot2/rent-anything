                "$ref": "#/components/schemas/partner_listing"
        '422':
          description: fees that aren't a list of named amounts charged per something
            we know
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
