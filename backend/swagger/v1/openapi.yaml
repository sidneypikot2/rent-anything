        '422':
          description: missing or wrong-typed values
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/payout_account_body"
  "/api/v1/partner/payout_accounts/{id}":
    parameters:
