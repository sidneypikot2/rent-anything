                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/partner/profile":
    get:
      summary: The signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Fields are null until the profile is first saved;
        `complete` drives the web app's banner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a saved profile without a phone is not complete
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Save the signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Every field but `display_name` is required; `phone`
        is saved on the user. Guests see a listing's business name (`/api/v1/partner/businesses`),
        not `display_name` (RAA-100). Email can't be changed here.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: no province, as in Metro Manila; a blank one is stored as null
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '422':
          description: a phone that isn't a phone number saves nothing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  nullable: true
                legal_first_name:
                  type: string
                legal_last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
              required:
              - legal_first_name
              - legal_last_name
              - phone
              - address
  "/api/v1/partner/verification":
    get:
      summary: The partner's ID check
      tags:
      - Partner
      description: Partner-only. Where the partner's Didit ID check stands. While
        it is pending, the API asks Didit for news first, so the status is current
        when the partner comes back from Didit's page.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'declined three times: waiting out the cooldown'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_verification"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Start or resume the partner's ID check
      tags:
      - Partner
      description: Partner-only. Returns the URL of Didit's hosted page, where the
        partner scans their ID and takes a selfie; Didit sends them back to the web
        app's `/partner/verify` after. An unfinished check is resumed rather than
        started again. After 3 declined checks the partner waits an hour from the
        last one (429), then gets 3 more tries.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: three tries again once the cooldown has passed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_verification_start"
        '429':
          description: declined three times within the hour
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  retry_at:
                    type: string
                    format: date-time
                required:
                - error
                - retry_at
        '422':
          description: a check Didit is still reviewing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '503':
          description: Didit isn't configured
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: Didit can't be reached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/quotes":
    get:
      summary: What a stay costs
      tags:
      - Discovery
      description: 'Public. The price of a stay at an active accommodation listing
        for the dates and guests, worked out from its stay rate (RAA-104): each night
        at the nightly price, or the weekend price on Friday and Saturday nights (a
        shared room''s per guest); each guest above base_guests at the extra-guest
        fee per night; the monthly discount from 28 nights, otherwise the weekly one
        from 7, off the nights and extra guests; then the required fees and the add-ons
        picked in fee_ids, never discounted. Money is in centavos. One unit is quoted,
        and availability isn''t checked yet.'
      parameters:
      - name: listing_id
        in: query
        required: true
        schema:
          type: integer
      - name: starts_on
        in: query
        format: date
        required: true
        description: Check-in
        schema:
          type: string
      - name: ends_on
        in: query
        format: date
        required: true
        description: Check-out
        schema:
          type: string
      - name: guests
        in: query
        required: true
        schema:
          type: integer
      - name: fee_ids[]
        in: query
        required: false
        description: Optional fees (add-ons) to include
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
      responses:
        '200':
          description: the nights, extra guests, discount and fees
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/stay_quote"
        '422':
          description: a listing that isn't active
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
  "/api/v1/registrations":
    post:
      summary: Sign up with email and password
      tags:
      - Auth
      description: "`role` is the entry point: `guest` from /login, `partner` from
        /partner/login. Admin accounts are never self-made. `name` and `phone` are
        optional; the account starts with `registration_complete: false` until PUT
        /api/v1/me/complete_profile."
      parameters: []
      responses:
        '201':
          description: a sign-up from /partner makes a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '422':
          description: email already taken by the same role, in any case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                  - guest
                  - partner
              required:
              - email
              - password
              - role
  "/api/v1/search_events":
    post:
      summary: Record a search
      tags:
      - Discovery
      description: Public. The web app sends one event when a guest picks a search
        result, or leaves a search without picking. Stored for 90 days with the query
        normalized and `session_id` only as a keyed hash; nothing identifies the guest.
        Feeds search popularity and the admin queues. Rate-limited per IP.
      parameters: []
      responses:
        '204':
          description: a listing is picked by id
        '422':
          description: an unknown target type
        '429':
          description: too many events from one IP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: What the guest typed, 2 to 100 characters
                result_count:
                  type: integer
                  minimum: 0
                  description: How many results the search showed
                session_id:
                  type: string
                  description: A random id the browser keeps for the visit, 8 to 128
                    characters
                target:
                  type: object
                  nullable: true
                  description: The result picked; null when none was. An area, landmark
                    or tag by slug, a listing by id.
                  properties:
                    type:
                      type: string
                      enum:
                      - area
                      - landmark
                      - tag
                      - listing
                    slug:
                      type: string
                    id:
                      type: integer
                  required:
                  - type
              required:
              - q
              - result_count
              - session_id
  "/api/v1/search":
    get:
      summary: Search destinations, landmarks, tags and listings
      tags:
      - Discovery
      description: One search box over areas, published landmarks, tags (activities,
        features, themes) and active listings. Accent- and typo-tolerant, and matches
        each record's aliases. At most 5 results per group. Areas without anything
        to book are left out, and listings carry no location.
      parameters:
      - name: q
        in: query
        required: true
        description: At least 2 characters
        schema:
          type: string
      responses:
        '200':
          description: 'popularity breaks a tie: the place guests pick more often
            comes first'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_results"
        '422':
          description: query missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
  "/api/v1/session":
    post:
      summary: Sign in with email and password
      tags:
      - Auth
      description: "`role` is the entry point signed in from. Email is unique per
        role, so only that role's account is looked up; an account of another role
        is not found (401)."
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an account made with Google has no password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: unknown role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum:
                  - guest
                  - partner
                  - admin
              required:
              - email
              - password
              - role
    delete:
      summary: Sign out (revoke a refresh token)
      tags:
      - Auth
      parameters: []
      responses:
        '204':
          description: an unknown token is ignored
        '422':
          description: token missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/tokens/refresh":
    post:
      summary: Trade a refresh token for new tokens
      tags:
      - Auth
      description: Each refresh token works once. Reusing one revokes every session
        of that user.
      parameters: []
      responses:
        '200':
          description: new tokens; the old refresh token is spent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an unknown token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: token given as an array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/trip_items":
    post:
      summary: Add a listing to a trip
      tags:
      - Trips
      description: 'Guest-only. Adds the listing to `trip_id`, or, without one, to
        a new trip named after the destination and dates ("Bantayan Island · Nov 12–15")
        with `quantity` guests. The trip''s dates grow to cover the item''s. Dates
        are optional, both or neither, `YYYY-MM-DD` and not in the past: an undated
        item can''t be checked out until it has one. `quantity` is 1 to 99, default
        1. Answers with the trip.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: an undated add
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: a listing that can't be booked, or a bad quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: into another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                listing_id:
                  type: integer
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                quantity:
                  type: integer
                trip_id:
                  type: integer
                  nullable: true
                  description: Omit or null for a new trip
              required:
              - listing_id
  "/api/v1/trip_items/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    patch:
      summary: Change an item or move it to another trip
      tags:
      - Trips
      description: Guest-only. Only the keys sent change; a date not sent keeps its
        value. `move_to_trip_id` moves it to another of the guest's trips. The trip
        it ends up in grows to cover its dates; the one it left keeps its dates. Answers
        with the trip it ends up in.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: moved to another trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: one date cleared
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's item, or a move into another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                quantity:
                  type: integer
                move_to_trip_id:
                  type: integer
    delete:
      summary: Remove an item from its trip
      tags:
      - Trips
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '204':
          description: removed; the trip stays
        '404':
          description: another guest's item
  "/api/v1/trips":
    get:
      summary: The signed-in guest's trips
      tags:
      - Trips
      description: 'Guest-only. The cart: every trip whose `deletes_on` hasn''t come,
        with its items. A trip that has ended, or an undated one with no edits for
        60 days, shows a deletion notice for 7 days; then a daily job deletes its
        unbooked items. Dated trips come first, soonest first; then undated ones,
        most recently edited first. `view=booked` lists instead every trip with a
        booked item, whenever it was (the Trips page, RAA-139), latest first.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - booked
      responses:
        '200':
          description: the guest's trips, up to 7 days after they end
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/trip"
        '422':
          description: a view that isn't one
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Plan a named trip
      tags:
      - Trips
      description: Guest-only. For guests who plan before adding anything; the first
        add creates a trip by itself (`POST /api/v1/trip_items`). `name` is required
        (at most 80 characters); dates are optional, both or neither, as `YYYY-MM-DD`,
        and not in the past; `guests` is 1 to 50, default 1.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: the new trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: no name, one date only, or a date that isn't a date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                guests:
                  type: integer
              required:
              - name
  "/api/v1/trips/suggestion":
    get:
      summary: Which trip an item should go to
      tags:
      - Trips
      description: Guest-only. Preselects a trip in the add sheet. A dated item goes
        to the trip whose dates are nearest its own, overlapping or up to 3 days away
        (then `extends_to` gives the trip's new dates); a tie goes to the trip with
        an item nearest the listing. An undated item goes to the most recently edited
        trip with the same destination (island, otherwise town or city). Only trips
        that haven't ended count. `trip` null means "New trip", which would be named
        `new_trip_name`.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: listing_id
        in: query
        schema:
          type: integer
        required: true
      - name: starts_on
        in: query
        schema:
          type: string
          format: date
        required: false
      - name: ends_on
        in: query
        schema:
          type: string
          format: date
        required: false
      responses:
        '200':
          description: 'no trip near: a new one'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip_suggestion"
        '422':
          description: a listing that can't be booked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/trips/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: One of the guest's trips
      tags:
      - Trips
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '404':
          description: another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Rename a trip or change its dates or guests
      tags:
      - Trips
      description: Guest-only. Only the keys sent change; a date not sent keeps its
        value. Null dates make the trip undated. The dates must still cover every
        dated item's dates.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the changed trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: dates that no longer cover an item
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                guests:
                  type: integer
    delete:
      summary: Delete a trip and its items
      tags:
      - Trips
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: another guest's trip
  "/api/v1/trips/{id}/merge":
    post:
      summary: Merge a trip into another
      tags:
      - Trips
      description: Guest-only. Moves every item into `into_trip_id`, whose dates grow
        to cover them, and deletes this trip. Answers with the trip merged into.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: 'a trip under way merged into a later one: its dates reach
            back'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: merged into itself
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: into another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                into_trip_id:
                  type: integer
              required:
              - into_trip_id
  "/api/v1/trips/{id}/copy":
    post:
      summary: Plan a trip again, from one of the guest's trips
      tags:
      - Trips
      description: 'Guest-only (RAA-139). A new trip with this trip''s items, each
        moved by as many days as `starts_on` is from this trip''s start, with the
        same guests. Nothing is booked: the items go in the cart. `starts_on` is required
        for a dated trip and can''t be in the past; `name` defaults to this trip''s
        name with "again", `guests` to its guests. An item whose listing can''t be
        booked any more is left out and listed in `skipped`.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: the new trip, and the items left out
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip:
                    "$ref": "#/components/schemas/trip"
                  skipped:
                    type: array
                    description: Items whose listing can't be booked any more
                    items:
                      type: object
                      properties:
                        listing_id:
                          type: integer
                        title:
                          type: string
                        reason:
                          type: string
                      required:
                      - listing_id
                      - title
                      - reason
                required:
                - trip
                - skipped
        '422':
          description: no start date for a dated trip, or one in the past
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                starts_on:
                  type: string
                  format: date
                guests:
                  type: integer
  "/api/v1/trips/{id}/quote":
    get:
      summary: What a trip's items would cost now
      tags:
      - Trips
      description: Guest-only (RAA-139). Each item priced as checkout would price
        it now, and checked against the listing's calendar; a booked item gives its
        booking's total. `problem` says why an item can't be booked as it is (no date,
        dates passed or taken, listing off), and such an item has no price. `total_cents`
        adds up the items without a problem; rentals and transfers are priced with
        the partner (`to_be_agreed`) and count ₱0.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: each item's price or problem, and the total
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip_quote"
        '404':
          description: another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/webhooks/didit":
    post:
      summary: Didit reports a change to an ID check
      tags:
      - Webhooks
      description: 'Called by Didit, not by the apps. Signed with HMAC-SHA256 of the
        raw body (`X-Signature`, keyed with the destination''s secret) and timestamped
        (`X-Timestamp`, Unix seconds, at most 5 minutes off). The status in the body
        is not trusted: the API reads it back from Didit.'
      parameters:
      - name: X-Signature
        in: header
        schema:
          type: string
      - name: X-Timestamp
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'a check we don''t know (an older session): ignored'
        '502':
          description: 'Didit can''t be asked for the status: Didit retries the delivery'
        '503':
          description: no webhook secret configured
        '401':
          description: no signature
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_type:
                  type: string
                session_id:
                  type: string
                status:
                  type: string
              required:
              - session_id
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    user:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - guest
          - partner
          - admin
        registration_complete:
          type: boolean
          description: False until name and phone are set (PUT /api/v1/me/complete_profile)
      required:
      - id
      - email
      - name
      - phone
      - role
      - registration_complete
    profile_address:
      type: object
      properties:
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
          description: Null where there is none
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2, e.g. PH
      required:
      - street
      - city
      - region
      - province
      - postal_code
      - country
    partner_profile:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          description: Shown to travellers; optional
        legal_first_name:
          type: string
          nullable: true
        legal_last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          description: Read-only here
        address:
          "$ref": "#/components/schemas/profile_address"
        complete:
          type: boolean
          description: True once the profile is saved and a phone is set
      required:
      - display_name
      - legal_first_name
      - legal_last_name
      - phone
      - email
      - address
      - complete
    partner_verification:
      type: object
      properties:
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - in_review
          - approved
          - declined
          - expired
        verified_at:
          type: string
          format: date-time
          nullable: true
        attempts_left:
          type: integer
          description: Declined checks left before an hour's wait (3 at most)
        retry_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the partner must wait before starting another check
      required:
      - status
      - verified_at
      - attempts_left
      - retry_at
    partner_verification_start:
      type: object
      properties:
        url:
          type: string
          description: Didit's hosted page; send the partner there
        verification:
          "$ref": "#/components/schemas/partner_verification"
      required:
      - url
      - verification
    guest_profile:
      type: object
      properties:
        legal_first_name:
          type: string
          nullable: true
        legal_last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          description: Read-only here
        address:
          "$ref": "#/components/schemas/profile_address"
        complete:
          type: boolean
          description: True once the profile is saved and a phone is set
      required:
      - legal_first_name
      - legal_last_name
      - phone
      - email
      - address
      - complete
    auth_tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires
        user:
          "$ref": "#/components/schemas/user"
      required:
      - access_token
      - refresh_token
      - expires_in
      - user
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    validation_errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
      - errors
    area_ref:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
      - slug
      - name
    tag:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - activity
          - feature
          - theme
      required:
      - slug
      - name
      - kind
    listing_summary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        area_slug:
          type: string
        instant_book:
          type: boolean
          description: 'Booked at once, without asking the partner (RAA-132): its
            pill'
        cover_photo_url:
          type: string
          nullable: true
          description: The cover photo, sized for a card (about 800 by 600); null
            when the listing has no photos
      required:
      - id
      - title
      - category
      - area_slug
      - instant_book
      - cover_photo_url
    trip:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        guests:
          type: integer
        destinations:
          type: array
          items:
            type: string
          description: 'Where the items are: each one''s island, or else its town
            or city, in item order'
        updated_at:
          type: string
          format: date-time
          description: Last edited, items included
        deletes_on:
          type: string
          format: date
          nullable: true
          description: When its unbooked items are deleted; set for the 7 days before,
            which start the day after the trip ends, or after 60 days without edits
            for an undated trip
        items:
          type: array
          items:
            "$ref": "#/components/schemas/trip_item"
          description: In date order, undated items last
      required:
      - id
      - name
      - starts_on
      - ends_on
      - guests
      - destinations
      - updated_at
      - deletes_on
      - items
    trip_item:
      type: object
      properties:
        id:
          type: integer
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
          description: 'Null with starts_on: not bookable until it has a date'
        quantity:
          type: integer
        booking_type:
          type: string
          enum:
          - rental
          - stay
          - activity
          - transfer
          description: 'Its listing''s: rentals and stays take a range of days, the
            others one day'
        area:
          "$ref": "#/components/schemas/area_ref"
        listing:
          "$ref": "#/components/schemas/listing_summary"
        booking:
          allOf:
          - "$ref": "#/components/schemas/booking_ref"
          nullable: true
          description: Its booking while one holds its days (RAA-132); a booked item
            can't be changed or removed
        cancellation_policy:
          type: string
          enum:
          - free_cancellation
          - seven_days
          - fourteen_days
          - non_refundable
          description: The listing's, which a booking made now would be under (RAA-139)
        listing_active:
          type: boolean
          description: 'False once the listing is paused or delisted: it can''t be
            booked'
      required:
      - id
      - starts_on
      - ends_on
      - quantity
      - booking_type
      - area
      - listing
      - booking
      - cancellation_policy
      - listing_active
    trip_quote:
      type: object
      properties:
        trip_id:
          type: integer
        total_cents:
          type: integer
          description: The items without a problem, booked ones at their booking's
            total
        to_be_agreed_count:
          type: integer
          description: Items priced with the partner, counted as ₱0 in the total
        items:
          type: array
          items:
            type: object
            properties:
              trip_item_id:
                type: integer
              total_cents:
                type: integer
                nullable: true
                description: Null with a problem
              to_be_agreed:
                type: boolean
                description: 'A rental or transfer: priced with the partner'
              problem:
                type: string
                nullable: true
                description: Why it can't be booked as it is
            required:
            - trip_item_id
            - total_cents
            - to_be_agreed
            - problem
      required:
      - trip_id
      - total_cents
      - to_be_agreed_count
      - items
    trip_suggestion:
      type: object
      properties:
        trip:
          allOf:
          - "$ref": "#/components/schemas/trip"
          nullable: true
          description: The trip to preselect; null means "New trip"
        extends_to:
          type: object
          nullable: true
          description: The suggested trip's dates once it takes the item, when they
            would grow
          properties:
            starts_on:
              type: string
              format: date
            ends_on:
              type: string
              format: date
          required:
          - starts_on
          - ends_on
        new_trip_name:
          type: string
          description: The name a new trip for this item would get
      required:
      - trip
      - extends_to
      - new_trip_name
    listing_pin:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        area_slug:
          type: string
        instant_book:
          type: boolean
          description: Booked at once, without asking the partner (RAA-132)
        cover_photo_url:
          type: string
          nullable: true
