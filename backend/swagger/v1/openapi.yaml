---
openapi: 3.0.3
info:
  title: Rent-Anything API
  version: v1
paths:
  "/api/v1/activities":
    get:
      summary: Activities guests can do in bookable areas
      tags:
      - Discovery
      description: Activity tags with the number of bookable areas and published landmarks
        that have them, most areas first. Activities with no bookable area are left
        out.
      responses:
        '200':
          description: activities with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/activity"
  "/api/v1/admin/destination_links":
    post:
      summary: Link two destinations
      tags:
      - Admin
      description: Admin-only. Links two areas or landmarks, usually from `GET /api/v1/admin/link_suggestions`.
        Explore then recommends each from the other. The order of the two ends doesn't
        matter, and a pair can only be linked once. `weight` (1 to 3, default 1) orders
        recommendations.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: the link is created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/destination_link"
        '422':
          description: a wrong kind, weight and end type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: no such place
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  "$ref": "#/components/schemas/place_key"
                target:
                  "$ref": "#/components/schemas/place_key"
                kind:
                  type: string
                  enum:
                  - bundled
                  - adjacent
                weight:
                  type: integer
                  minimum: 1
                  maximum: 3
              required:
              - source
              - target
              - kind
  "/api/v1/admin/link_suggestions":
    get:
      summary: Destination links suggested by search picks
      tags:
      - Admin
      description: Admin-only. Pairs of published areas and landmarks that guests
        picked in the same visit, in at least 3 visits over the last 90 days, most
        visits first, at most 50. Pairs already linked are left out. Approve one with
        `POST /api/v1/admin/destination_links`.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: pairs picked together often enough, not yet linked
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/link_suggestion"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/admin/search_term_queue":
    get:
      summary: Searches that need a search term
      tags:
      - Admin
      description: Admin-only. Queries from the last 90 days that found nothing or
        whose results guests rarely picked (under 1 in 5), most searched first, at
        most 50. A query that now matches a name or alias exactly is left out. Add
        one as a search term with `POST /api/v1/admin/search_terms`.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: unanswered and unpicked queries, most searched first
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/search_term_queue_entry"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/admin/search_terms":
    post:
      summary: Add a search term to a place
      tags:
      - Admin
      description: Admin-only. Adds the query as an alias of an area, landmark or
        tag, so the search box finds the place by it once the search index refreshes
        (queued right away). An alias the place already has, in any case or accents,
        is not added twice.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: an alias the place already has is not repeated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_term_target"
        '422':
          description: a missing target
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: no such place
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The search term, 2 to 100 characters
                target:
                  "$ref": "#/components/schemas/place_key"
              required:
              - query
              - target
  "/api/v1/areas":
    get:
      summary: Destinations with something to book
      tags:
      - Discovery
      description: Areas with at least one active listing, most listings first, each
        with its top three activities (by how many published landmarks carry them).
      responses:
        '200':
          description: bookable areas
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/area_card"
  "/api/v1/areas/{slug}":
    get:
      summary: 'A destination: its landmarks and what to book there'
      tags:
      - Discovery
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: a province lists the areas under it that have something to
            book
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/area_detail"
        '404':
          description: unknown area
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/explore":
    get:
      summary: Listings, nearby destinations and recommendations for a destination
      tags:
      - Discovery
      description: 'One starting point (an area, a published landmark or a map pin)
        and what makes sense for it. Listings are scoped by the kind of place: a province,
        city or island returns what is inside it, a town, landmark or pin what is
        within `km`. Anything on an island is isolated to that island, measured on
        the listing''s exact point. Nearby destinations are areas and landmarks within
        `km` (inside a province). Recommendations are curated destination links: they
        may cross water, never add listings, and are not repeated as nearby destinations.
        Listing locations are rounded to about 1 km.'
      parameters:
      - name: area
        in: query
        required: false
        description: Area slug
        schema:
          type: string
      - name: landmark
        in: query
        required: false
        description: Published landmark slug
        schema:
          type: string
      - name: lat
        in: query
        required: false
        description: Map pin latitude, with lng
        schema:
          type: number
      - name: lng
        in: query
        required: false
        description: Map pin longitude, with lat
        schema:
          type: number
      - name: km
        in: query
        required: false
        description: Radius, 1 to 50 (default 15)
        schema:
          type: number
      responses:
        '200':
          description: 'a pin outside every area: a plain radius'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/explore"
        '404':
          description: a draft landmark
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: values out of range or not numbers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
  "/api/v1/health":
    get:
      summary: Liveness and database check
      tags:
      - Health
      responses:
        '200':
          description: the API and its database answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  postgis:
                    type: string
                required:
                - status
                - postgis
  "/api/v1/landmarks":
    get:
      summary: Published landmarks with their location
      tags:
      - Discovery
      description: 'Every published landmark, by name, with its exact location: landmarks
        are public places.'
      responses:
        '200':
          description: published landmarks
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/landmark_pin"
  "/api/v1/listings":
    get:
      summary: Active listings with their approximate location
      tags:
      - Discovery
      description: Every active listing, by title, with its location rounded to two
        decimals (about 1 km). The exact point is revealed only after a paid booking.
      responses:
        '200':
          description: active listings, location rounded
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/listing_pin"
  "/api/v1/me/complete_profile":
    put:
      summary: Finish sign-up with a name and phone
      tags:
      - Auth
      description: Sign-up asks only for email and password; the web app sends a user
        whose `registration_complete` is false here before anything else. Both fields
        are required. Guests and partners alike.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a partner completes theirs
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone with no digits
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  description: Digits, spaces, ( ) - and a leading +; 7 to 15 digits
              required:
              - name
              - phone
  "/api/v1/me/profile":
    get:
      summary: The signed-in guest's profile
      tags:
      - Auth
      description: Guest-only (a partner's is /api/v1/partner/profile). Fields are
        null until the profile is first saved; `complete` drives the web app's banner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a saved profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_profile"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Save the signed-in guest's profile
      tags:
      - Auth
      description: Guest-only. Every field is required except `address.province`;
        `phone` is saved on the user. Email can't be changed here.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a display name and an email are ignored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_profile"
        '422':
          description: a phone that isn't a phone number saves nothing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_first_name:
                  type: string
                legal_last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
              required:
              - legal_first_name
              - legal_last_name
              - phone
              - address
  "/api/v1/me":
    get:
      summary: The signed-in user
      tags:
      - Auth
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '401':
          description: an expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Edit the signed-in user's profile
      tags:
      - Auth
      description: Only `name` and `phone`; keys left out are unchanged. A blank or
        null `phone` clears it.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a blank phone clears it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone given as a number
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  nullable: true
  "/api/v1/partner/me":
    get:
      summary: The signed-in partner
      tags:
      - Auth
      description: Partner-only, like everything under /api/v1/partner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/oauth/{provider}":
    post:
      summary: Sign in or sign up with Google or Facebook
      tags:
      - Auth
      description: "`token` is a Google Identity Services ID token or a Facebook Login
        access token. It signs in to, links or creates an account of `role` only,
        so one Google account can have a guest and a partner account."
      parameters:
      - name: provider
        in: path
        schema:
          type: string
          enum:
          - google
          - facebook
        required: true
      responses:
        '200':
          description: a new user is created with the entry point's role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: the provider rejects the token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: unknown provider
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: token missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                role:
                  type: string
                  enum:
                  - guest
                  - partner
              required:
              - token
              - role
  "/api/v1/partner/listing_options":
    get:
      summary: 'What a new listing can be: its bookable categories'
      tags:
      - Partner
      description: Partner-only. Bookable (leaf) categories with the JSON Schema their
        `attrs` must match.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: leaf categories
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/listing_options"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/partner/listings":
    get:
      summary: The signed-in partner's listings
      tags:
      - Partner
      description: 'Partner-only. Every listing the partner owns, in any status, ordered
        by category name, then title. The exact location is included: the reader owns
        the listing.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: only the partner's own listings, by category then title
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/partner_listing"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Add a listing
      tags:
      - Partner
      description: Partner-only. The listing is saved as a draft; any `status` sent
        is ignored. `attrs` is checked against the category's `attribute_schema` (see
        `GET /api/v1/partner/listing_options`). The listing's area is the smallest
        published city, town or island whose boundary covers the pin; failing that,
        the one whose center is nearest the pin, within 50 km. The partner must have
        passed the ID check first (`/api/v1/partner/verification`); until then it
        is a 403.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: an address without a province
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_listing"
        '422':
          description: an address that isn't an object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/listing_body"
  "/api/v1/partner/listings/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    - name: Authorization
      in: header
      schema:
        type: string
    get:
      summary: One of the signed-in partner's listings
      tags:
      - Partner
      description: Partner-only. Any status. Another partner's listing is a 404.
      security:
      - bearer: []
      responses:
        '200':
          description: the partner's listing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_listing"
        '404':
          description: another partner's listing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Change a listing
      tags:
      - Partner
      description: 'Partner-only. The whole listing is sent again, with the same rules
        as adding one; the area is recomputed from the pin. Any `status` sent is ignored:
        the listing keeps its status. Another partner''s listing is a 404.'
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: saved, in the area nearest the new pin, status unchanged
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_listing"
        '422':
          description: missing and wrong-typed values
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another partner's listing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/listing_body"
    delete:
      summary: Delete a listing
      tags:
      - Partner
      description: Partner-only. Deletes the listing for good, and takes it out of
        any guest's trip. Another partner's listing is a 404.
      security:
      - bearer: []
      responses:
        '204':
          description: 'deleted while in a guest''s trip: the item goes, the trip
            stays'
        '404':
          description: another partner's listing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/partner/profile":
    get:
      summary: The signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Fields are null until the profile is first saved;
        `complete` drives the web app's banner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a saved profile without a phone is not complete
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Save the signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Every field but `display_name` is required; `phone`
        is saved on the user. Email can't be changed here.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: no province, as in Metro Manila; a blank one is stored as null
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '422':
          description: a phone that isn't a phone number saves nothing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  nullable: true
                legal_first_name:
                  type: string
                legal_last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
              required:
              - legal_first_name
              - legal_last_name
              - phone
              - address
  "/api/v1/partner/verification":
    get:
      summary: The partner's ID check
      tags:
      - Partner
      description: Partner-only. Where the partner's Didit ID check stands. While
        it is pending, the API asks Didit for news first, so the status is current
        when the partner comes back from Didit's page.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'declined three times: waiting out the cooldown'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_verification"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Start or resume the partner's ID check
      tags:
      - Partner
      description: Partner-only. Returns the URL of Didit's hosted page, where the
        partner scans their ID and takes a selfie; Didit sends them back to the web
        app's `/partner/verify` after. An unfinished check is resumed rather than
        started again. After 3 declined checks the partner waits an hour from the
        last one (429), then gets 3 more tries.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: three tries again once the cooldown has passed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_verification_start"
        '429':
          description: declined three times within the hour
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  retry_at:
                    type: string
                    format: date-time
                required:
                - error
                - retry_at
        '422':
          description: a check Didit is still reviewing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '503':
          description: Didit isn't configured
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: Didit can't be reached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/registrations":
    post:
      summary: Sign up with email and password
      tags:
      - Auth
      description: "`role` is the entry point: `guest` from /login, `partner` from
        /partner/login. Admin accounts are never self-made. `name` and `phone` are
        optional; the account starts with `registration_complete: false` until PUT
        /api/v1/me/complete_profile."
      parameters: []
      responses:
        '201':
          description: a sign-up from /partner makes a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '422':
          description: email already taken by the same role, in any case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                  - guest
                  - partner
              required:
              - email
              - password
              - role
  "/api/v1/search_events":
    post:
      summary: Record a search
      tags:
      - Discovery
      description: Public. The web app sends one event when a guest picks a search
        result, or leaves a search without picking. Stored for 90 days with the query
        normalized and `session_id` only as a keyed hash; nothing identifies the guest.
        Feeds search popularity and the admin queues. Rate-limited per IP.
      parameters: []
      responses:
        '204':
          description: a listing is picked by id
        '422':
          description: an unknown target type
        '429':
          description: too many events from one IP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: What the guest typed, 2 to 100 characters
                result_count:
                  type: integer
                  minimum: 0
                  description: How many results the search showed
                session_id:
                  type: string
                  description: A random id the browser keeps for the visit, 8 to 128
                    characters
                target:
                  type: object
                  nullable: true
                  description: The result picked; null when none was. An area, landmark
                    or tag by slug, a listing by id.
                  properties:
                    type:
                      type: string
                      enum:
                      - area
                      - landmark
                      - tag
                      - listing
                    slug:
                      type: string
                    id:
                      type: integer
                  required:
                  - type
              required:
              - q
              - result_count
              - session_id
  "/api/v1/search":
    get:
      summary: Search destinations, landmarks, tags and listings
      tags:
      - Discovery
      description: One search box over areas, published landmarks, tags (activities,
        features, themes) and active listings. Accent- and typo-tolerant, and matches
        each record's aliases. At most 5 results per group. Areas without anything
        to book are left out, and listings carry no location.
      parameters:
      - name: q
        in: query
        required: true
        description: At least 2 characters
        schema:
          type: string
      responses:
        '200':
          description: 'popularity breaks a tie: the place guests pick more often
            comes first'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_results"
        '422':
          description: query missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
  "/api/v1/session":
    post:
      summary: Sign in with email and password
      tags:
      - Auth
      description: "`role` is the entry point signed in from. Email is unique per
        role, so only that role's account is looked up; an account of another role
        is not found (401)."
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an account made with Google has no password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: unknown role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum:
                  - guest
                  - partner
                  - admin
              required:
              - email
              - password
              - role
    delete:
      summary: Sign out (revoke a refresh token)
      tags:
      - Auth
      parameters: []
      responses:
        '204':
          description: an unknown token is ignored
        '422':
          description: token missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/tokens/refresh":
    post:
      summary: Trade a refresh token for new tokens
      tags:
      - Auth
      description: Each refresh token works once. Reusing one revokes every session
        of that user.
      parameters: []
      responses:
        '200':
          description: new tokens; the old refresh token is spent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an unknown token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: token given as an array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/trip_items":
    post:
      summary: Add a listing to a trip
      tags:
      - Trips
      description: 'Guest-only. Adds the listing to `trip_id`, or, without one, to
        a new trip named after the destination and dates ("Bantayan Island · Nov 12–15")
        with `quantity` guests. The trip''s dates grow to cover the item''s. Dates
        are optional, both or neither, `YYYY-MM-DD` and not in the past: an undated
        item can''t be checked out until it has one. `quantity` is 1 to 99, default
        1. Answers with the trip.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: an undated add
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: a listing that can't be booked, or a bad quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: into another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                listing_id:
                  type: integer
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                quantity:
                  type: integer
                trip_id:
                  type: integer
                  nullable: true
                  description: Omit or null for a new trip
              required:
              - listing_id
  "/api/v1/trip_items/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    patch:
      summary: Change an item or move it to another trip
      tags:
      - Trips
      description: Guest-only. Only the keys sent change; a date not sent keeps its
        value. `move_to_trip_id` moves it to another of the guest's trips. The trip
        it ends up in grows to cover its dates; the one it left keeps its dates. Answers
        with the trip it ends up in.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: moved to another trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: one date cleared
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's item, or a move into another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                quantity:
                  type: integer
                move_to_trip_id:
                  type: integer
    delete:
      summary: Remove an item from its trip
      tags:
      - Trips
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '204':
          description: removed; the trip stays
        '404':
          description: another guest's item
  "/api/v1/trips":
    get:
      summary: The signed-in guest's trips
      tags:
      - Trips
      description: 'Guest-only. The cart: every trip whose `deletes_on` hasn''t come,
        with its items. A trip that has ended, or an undated one with no edits for
        60 days, shows a deletion notice for 7 days; then a daily job deletes its
        unbooked items. Dated trips come first, soonest first; then undated ones,
        most recently edited first.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the guest's trips, up to 7 days after they end
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/trip"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Plan a named trip
      tags:
      - Trips
      description: Guest-only. For guests who plan before adding anything; the first
        add creates a trip by itself (`POST /api/v1/trip_items`). `name` is required
        (at most 80 characters); dates are optional, both or neither, as `YYYY-MM-DD`,
        and not in the past; `guests` is 1 to 50, default 1.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: the new trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: no name, one date only, or a date that isn't a date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                guests:
                  type: integer
              required:
              - name
  "/api/v1/trips/suggestion":
    get:
      summary: Which trip an item should go to
      tags:
      - Trips
      description: Guest-only. Preselects a trip in the add sheet. A dated item goes
        to the trip whose dates are nearest its own, overlapping or up to 3 days away
        (then `extends_to` gives the trip's new dates); a tie goes to the trip with
        an item nearest the listing. An undated item goes to the most recently edited
        trip with the same destination (island, otherwise town or city). Only trips
        that haven't ended count. `trip` null means "New trip", which would be named
        `new_trip_name`.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: listing_id
        in: query
        schema:
          type: integer
        required: true
      - name: starts_on
        in: query
        schema:
          type: string
          format: date
        required: false
      - name: ends_on
        in: query
        schema:
          type: string
          format: date
        required: false
      responses:
        '200':
          description: 'no trip near: a new one'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip_suggestion"
        '422':
          description: a listing that can't be booked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/trips/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: One of the guest's trips
      tags:
      - Trips
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '404':
          description: another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Rename a trip or change its dates or guests
      tags:
      - Trips
      description: Guest-only. Only the keys sent change; a date not sent keeps its
        value. Null dates make the trip undated. The dates must still cover every
        dated item's dates.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the changed trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: dates that no longer cover an item
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                guests:
                  type: integer
    delete:
      summary: Delete a trip and its items
      tags:
      - Trips
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '204':
          description: deleted
        '404':
          description: another guest's trip
  "/api/v1/trips/{id}/merge":
    post:
      summary: Merge a trip into another
      tags:
      - Trips
      description: Guest-only. Moves every item into `into_trip_id`, whose dates grow
        to cover them, and deletes this trip. Answers with the trip merged into.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: 'a trip under way merged into a later one: its dates reach
            back'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/trip"
        '422':
          description: merged into itself
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: into another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                into_trip_id:
                  type: integer
              required:
              - into_trip_id
  "/api/v1/webhooks/didit":
    post:
      summary: Didit reports a change to an ID check
      tags:
      - Webhooks
      description: 'Called by Didit, not by the apps. Signed with HMAC-SHA256 of the
        raw body (`X-Signature`, keyed with the destination''s secret) and timestamped
        (`X-Timestamp`, Unix seconds, at most 5 minutes off). The status in the body
        is not trusted: the API reads it back from Didit.'
      parameters:
      - name: X-Signature
        in: header
        schema:
          type: string
      - name: X-Timestamp
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'a check we don''t know (an older session): ignored'
        '502':
          description: 'Didit can''t be asked for the status: Didit retries the delivery'
        '503':
          description: no webhook secret configured
        '401':
          description: no signature
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_type:
                  type: string
                session_id:
                  type: string
                status:
                  type: string
              required:
              - session_id
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    user:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - guest
          - partner
          - admin
        registration_complete:
          type: boolean
          description: False until name and phone are set (PUT /api/v1/me/complete_profile)
      required:
      - id
      - email
      - name
      - phone
      - role
      - registration_complete
    profile_address:
      type: object
      properties:
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
          description: Null where there is none
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2, e.g. PH
      required:
      - street
      - city
      - region
      - province
      - postal_code
      - country
    partner_profile:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          description: Shown to travellers; optional
        legal_first_name:
          type: string
          nullable: true
        legal_last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          description: Read-only here
        address:
          "$ref": "#/components/schemas/profile_address"
        complete:
          type: boolean
          description: True once the profile is saved and a phone is set
      required:
      - display_name
      - legal_first_name
      - legal_last_name
      - phone
      - email
      - address
      - complete
    partner_verification:
      type: object
      properties:
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - in_review
          - approved
          - declined
          - expired
        verified_at:
          type: string
          format: date-time
          nullable: true
        attempts_left:
          type: integer
          description: Declined checks left before an hour's wait (3 at most)
        retry_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the partner must wait before starting another check
      required:
      - status
      - verified_at
      - attempts_left
      - retry_at
    partner_verification_start:
      type: object
      properties:
        url:
          type: string
          description: Didit's hosted page; send the partner there
        verification:
          "$ref": "#/components/schemas/partner_verification"
      required:
      - url
      - verification
    guest_profile:
      type: object
      properties:
        legal_first_name:
          type: string
          nullable: true
        legal_last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          description: Read-only here
