---
openapi: 3.0.3
info:
  title: Rent-Anything API
  version: v1
paths:
  "/api/v1/activities":
    get:
      summary: Activities guests can do in bookable areas
      tags:
      - Discovery
      description: Activity tags with the number of bookable areas and published landmarks
        that have them, most areas first. Activities with no bookable area are left
        out.
      responses:
        '200':
          description: activities with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/activity"
  "/api/v1/areas":
    get:
      summary: Destinations with something to book
      tags:
      - Discovery
      description: Areas with at least one active listing, most listings first, each
        with its top three activities (by how many published landmarks carry them).
      responses:
        '200':
          description: bookable areas
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/area_card"
  "/api/v1/areas/{slug}":
    get:
      summary: 'A destination: its landmarks and what to book there'
      tags:
      - Discovery
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: a province lists the areas under it that have something to
            book
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/area_detail"
        '404':
          description: unknown area
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/health":
    get:
      summary: Liveness and database check
      tags:
      - Health
      responses:
        '200':
          description: the API and its database answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  postgis:
                    type: string
                required:
                - status
                - postgis
  "/api/v1/me/complete_profile":
    put:
      summary: Finish sign-up with a name and phone
      tags:
      - Auth
      description: Sign-up asks only for email and password; the web app sends a user
        whose `registration_complete` is false here before anything else. Both fields
        are required. Guests and partners alike.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a partner completes theirs
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone with no digits
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  description: Digits, spaces, ( ) - and a leading +; 7 to 15 digits
              required:
              - name
              - phone
  "/api/v1/me":
    get:
      summary: The signed-in user
      tags:
      - Auth
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '401':
          description: an expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Edit the signed-in user's profile
      tags:
      - Auth
      description: Only `name` and `phone`; keys left out are unchanged. A blank or
        null `phone` clears it.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a blank phone clears it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone given as a number
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  nullable: true
  "/api/v1/partner/me":
    get:
      summary: The signed-in partner
      tags:
      - Auth
      description: Partner-only, like everything under /api/v1/partner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/oauth/{provider}":
    post:
      summary: Sign in or sign up with Google or Facebook
      tags:
      - Auth
      description: "`token` is a Google Identity Services ID token or a Facebook Login
        access token. It signs in to, links or creates an account of `role` only,
        so one Google account can have a guest and a partner account."
      parameters:
      - name: provider
        in: path
        schema:
          type: string
          enum:
          - google
          - facebook
        required: true
      responses:
        '200':
          description: a new user is created with the entry point's role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: the provider rejects the token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: unknown provider
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: token missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                role:
                  type: string
                  enum:
                  - guest
                  - partner
              required:
              - token
              - role
  "/api/v1/partner/profile":
    get:
      summary: The signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Fields are null until the profile is first saved;
        `complete` drives the web app's banner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a saved profile without a phone is not complete
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Save the signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Every field but `display_name` is required; `phone`
        is saved on the user. Email can't be changed here.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: no province, as in Metro Manila; a blank one is stored as null
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '422':
          description: a phone that isn't a phone number saves nothing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  nullable: true
                legal_first_name:
                  type: string
                legal_last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
              required:
              - legal_first_name
              - legal_last_name
              - phone
              - address
  "/api/v1/registrations":
    post:
      summary: Sign up with email and password
      tags:
      - Auth
      description: "`role` is the entry point: `guest` from /login, `partner` from
        /partner/login. Admin accounts are never self-made. `name` and `phone` are
        optional; the account starts with `registration_complete: false` until PUT
        /api/v1/me/complete_profile."
      parameters: []
      responses:
        '201':
          description: a sign-up from /partner makes a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '422':
          description: email already taken by the same role, in any case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                  - guest
                  - partner
              required:
              - email
              - password
              - role
  "/api/v1/search":
    get:
      summary: Search destinations, landmarks, tags and listings
      tags:
      - Discovery
      description: One search box over areas, published landmarks, tags (activities,
        features, themes) and active listings. Accent- and typo-tolerant, and matches
        each record's aliases. At most 5 results per group. Areas without anything
        to book are left out, and listings carry no location.
      parameters:
      - name: q
        in: query
        required: true
        description: At least 2 characters
        schema:
          type: string
      responses:
        '200':
          description: exact name ranks first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_results"
        '422':
          description: query missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
  "/api/v1/session":
    post:
      summary: Sign in with email and password
      tags:
      - Auth
      description: "`role` is the entry point signed in from. Email is unique per
        role, so only that role's account is looked up; an account of another role
        is not found (401)."
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an account made with Google has no password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: unknown role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum:
                  - guest
                  - partner
                  - admin
              required:
              - email
              - password
              - role
    delete:
      summary: Sign out (revoke a refresh token)
      tags:
      - Auth
      parameters: []
      responses:
        '204':
          description: an unknown token is ignored
        '422':
          description: token missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/tokens/refresh":
    post:
      summary: Trade a refresh token for new tokens
      tags:
      - Auth
      description: Each refresh token works once. Reusing one revokes every session
        of that user.
      parameters: []
      responses:
        '200':
          description: new tokens; the old refresh token is spent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an unknown token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: token given as an array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    user:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - guest
          - partner
          - admin
        registration_complete:
          type: boolean
          description: False until name and phone are set (PUT /api/v1/me/complete_profile)
      required:
      - id
      - email
      - name
      - phone
      - role
      - registration_complete
    partner_profile:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          description: Shown to travellers; optional
        legal_first_name:
          type: string
          nullable: true
        legal_last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          description: Read-only here
        address:
          type: object
          properties:
            street:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            region:
              type: string
              nullable: true
            province:
              type: string
              nullable: true
              description: Null where there is none
            postal_code:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
              description: ISO 3166-1 alpha-2, e.g. PH
          required:
          - street
          - city
          - region
          - province
          - postal_code
          - country
        complete:
          type: boolean
          description: True once the profile is saved and a phone is set
      required:
      - display_name
      - legal_first_name
      - legal_last_name
      - phone
      - email
      - address
      - complete
    auth_tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires
        user:
          "$ref": "#/components/schemas/user"
      required:
      - access_token
      - refresh_token
      - expires_in
      - user
    error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    validation_errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
      - errors
    area_ref:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
      - slug
      - name
    tag:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - activity
          - feature
          - theme
      required:
      - slug
      - name
      - kind
    listing_summary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        area_slug:
          type: string
      required:
      - id
      - title
      - category
      - area_slug
    area:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - region
          - province
          - city
          - town
          - island
        parent_name:
          type: string
          nullable: true
      required:
      - slug
      - name
      - kind
      - parent_name
    area_card:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - region
          - province
          - city
          - town
          - island
        parent_name:
          type: string
          nullable: true
        landmark_count:
          type: integer
        listing_count:
          type: integer
        activities:
          type: array
          items:
            "$ref": "#/components/schemas/tag"
      required:
      - slug
      - name
      - kind
      - parent_name
      - landmark_count
      - listing_count
      - activities
    area_detail:
      type: object
      properties:
        area:
          "$ref": "#/components/schemas/area"
        areas:
          type: array
          description: Areas under this one that have something to book
          items:
            "$ref": "#/components/schemas/area"
        landmarks:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              description:
                type: string
              tags:
                type: array
                items:
                  "$ref": "#/components/schemas/tag"
            required:
            - slug
            - name
            - description
            - tags
        listings:
          type: array
          items:
            type: object
            description: A listing summary plus its booking type; no location
            properties:
              id:
                type: integer
              title:
                type: string
              category:
                type: string
              area_slug:
                type: string
              booking_type:
                type: string
                enum:
                - rental
                - stay
                - activity
                - transfer
            required:
            - id
            - title
            - category
            - area_slug
            - booking_type
      required:
      - area
      - areas
      - landmarks
      - listings
    activity:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        area_count:
          type: integer
        landmark_count:
          type: integer
      required:
      - slug
      - name
      - area_count
      - landmark_count
    search_results:
      type: object
      properties:
        areas:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              kind:
                type: string
                enum:
                - region
                - province
                - city
                - town
                - island
              parent_name:
                type: string
                nullable: true
            required:
            - slug
            - name
            - kind
            - parent_name
        landmarks:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              area:
                "$ref": "#/components/schemas/area_ref"
            required:
            - slug
            - name
            - area
        tags:
          type: array
          description: Matching tags, each with the bookable areas that have landmarks
            carrying it, most landmarks first
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              kind:
                type: string
                enum:
                - activity
                - feature
                - theme
              areas:
                type: array
                items:
                  type: object
                  properties:
                    slug:
                      type: string
                    name:
                      type: string
                    landmark_count:
                      type: integer
                  required:
                  - slug
                  - name
                  - landmark_count
            required:
            - slug
            - name
            - kind
            - areas
        listings:
          type: array
          items:
            "$ref": "#/components/schemas/listing_summary"
      required:
      - areas
      - landmarks
      - tags
      - listings
