            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
