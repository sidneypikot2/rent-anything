---
openapi: 3.0.3
info:
  title: Rent-Anything API
  version: v1
paths:
  "/api/v1/activities":
    get:
      summary: Activities guests can do in bookable areas
      tags:
      - Discovery
      description: Activity tags with the number of bookable areas and published landmarks
        that have them, most areas first. Activities with no bookable area are left
        out.
      responses:
        '200':
          description: activities with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/activity"
  "/api/v1/areas":
    get:
      summary: Destinations with something to book
      tags:
      - Discovery
      description: Areas with at least one active listing, most listings first, each
        with its top three activities (by how many published landmarks carry them).
      responses:
        '200':
          description: bookable areas
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/area_card"
  "/api/v1/areas/{slug}":
    get:
      summary: 'A destination: its landmarks and what to book there'
      tags:
      - Discovery
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: a province lists the areas under it that have something to
            book
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/area_detail"
        '404':
          description: unknown area
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/health":
    get:
      summary: Liveness and database check
      tags:
      - Health
      responses:
        '200':
          description: the API and its database answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  postgis:
                    type: string
                required:
                - status
                - postgis
  "/api/v1/me/complete_profile":
    put:
      summary: Finish sign-up with a name and phone
      tags:
      - Auth
      description: Sign-up asks only for email and password; the web app sends a user
        whose `registration_complete` is false here before anything else. Both fields
        are required. Guests and partners alike.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a partner completes theirs
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone with no digits
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  description: Digits, spaces, ( ) - and a leading +; 7 to 15 digits
              required:
              - name
              - phone
  "/api/v1/me/profile":
    get:
      summary: The signed-in guest's profile
      tags:
      - Auth
      description: Guest-only (a partner's is /api/v1/partner/profile). Fields are
        null until the profile is first saved; `complete` drives the web app's banner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a saved profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_profile"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Save the signed-in guest's profile
      tags:
      - Auth
      description: Guest-only. Every field is required except `address.province`;
        `phone` is saved on the user. Email can't be changed here.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a display name and an email are ignored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_profile"
        '422':
          description: a phone that isn't a phone number saves nothing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_first_name:
                  type: string
                legal_last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
              required:
              - legal_first_name
              - legal_last_name
              - phone
              - address
  "/api/v1/me":
    get:
      summary: The signed-in user
      tags:
      - Auth
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '401':
          description: an expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Edit the signed-in user's profile
      tags:
      - Auth
      description: Only `name` and `phone`; keys left out are unchanged. A blank or
        null `phone` clears it.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a blank phone clears it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone given as a number
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  nullable: true
  "/api/v1/partner/me":
    get:
      summary: The signed-in partner
      tags:
      - Auth
      description: Partner-only, like everything under /api/v1/partner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/oauth/{provider}":
    post:
      summary: Sign in or sign up with Google or Facebook
      tags:
      - Auth
      description: "`token` is a Google Identity Services ID token or a Facebook Login
        access token. It signs in to, links or creates an account of `role` only,
        so one Google account can have a guest and a partner account."
      parameters:
      - name: provider
        in: path
        schema:
          type: string
          enum:
          - google
          - facebook
        required: true
      responses:
        '200':
          description: a new user is created with the entry point's role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: the provider rejects the token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: unknown provider
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: token missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                role:
                  type: string
                  enum:
                  - guest
                  - partner
              required:
              - token
              - role
  "/api/v1/partner/listing_options":
    get:
      summary: 'What a new listing can be: its bookable categories'
      tags:
      - Partner
      description: Partner-only. Bookable (leaf) categories with the JSON Schema their
        `attrs` must match.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: leaf categories
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/listing_options"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/partner/listings":
    get:
      summary: The signed-in partner's listings
      tags:
      - Partner
      description: 'Partner-only. Every listing the partner owns, in any status, ordered
        by category name, then title. The exact location is included: the reader owns
        the listing.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: only the partner's own listings, by category then title
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/partner_listing"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Add a listing
      tags:
      - Partner
      description: Partner-only. The listing is saved as a draft; any `status` sent
        is ignored. `attrs` is checked against the category's `attribute_schema` (see
        `GET /api/v1/partner/listing_options`). The listing's area is the city, town
        or island nearest the pin, within 50 km. The partner must have passed the
        ID check first (`/api/v1/partner/verification`); until then it is a 403.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: an address without a province
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_listing"
        '422':
          description: an address that isn't an object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 5000
                category_id:
                  type: integer
                  description: A bookable (leaf) category
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
                location:
                  type: object
                  properties:
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lng:
                      type: number
                      minimum: -180
                      maximum: 180
                  required:
                  - lat
                  - lng
                attrs:
                  type: object
                  additionalProperties: true
              required:
              - title
              - category_id
              - address
              - location
  "/api/v1/partner/profile":
    get:
      summary: The signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Fields are null until the profile is first saved;
        `complete` drives the web app's banner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a saved profile without a phone is not complete
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Save the signed-in partner's profile
      tags:
      - Partner
      description: Partner-only. Every field but `display_name` is required; `phone`
        is saved on the user. Email can't be changed here.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: no province, as in Metro Manila; a blank one is stored as null
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_profile"
        '422':
          description: a phone that isn't a phone number saves nothing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  nullable: true
                legal_first_name:
                  type: string
                legal_last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
              required:
              - legal_first_name
              - legal_last_name
              - phone
              - address
  "/api/v1/partner/verification":
    get:
      summary: The partner's ID check
      tags:
      - Partner
      description: Partner-only. Where the partner's Didit ID check stands. While
        it is pending, the API asks Didit for news first, so the status is current
        when the partner comes back from Didit's page.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'declined three times: waiting out the cooldown'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_verification"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Start or resume the partner's ID check
      tags:
      - Partner
      description: Partner-only. Returns the URL of Didit's hosted page, where the
        partner scans their ID and takes a selfie; Didit sends them back to the web
        app's `/partner/verify` after. An unfinished check is resumed rather than
        started again. After 3 declined checks the partner waits an hour from the
        last one (429), then gets 3 more tries.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: three tries again once the cooldown has passed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/partner_verification_start"
        '429':
          description: declined three times within the hour
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  retry_at:
                    type: string
                    format: date-time
                required:
                - error
                - retry_at
        '422':
          description: a check Didit is still reviewing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '503':
          description: Didit isn't configured
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: Didit can't be reached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/registrations":
    post:
      summary: Sign up with email and password
      tags:
      - Auth
      description: "`role` is the entry point: `guest` from /login, `partner` from
        /partner/login. Admin accounts are never self-made. `name` and `phone` are
        optional; the account starts with `registration_complete: false` until PUT
        /api/v1/me/complete_profile."
      parameters: []
      responses:
        '201':
          description: a sign-up from /partner makes a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '422':
          description: email already taken by the same role, in any case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                  - guest
                  - partner
              required:
              - email
              - password
              - role
  "/api/v1/search":
    get:
      summary: Search destinations, landmarks, tags and listings
      tags:
      - Discovery
      description: One search box over areas, published landmarks, tags (activities,
        features, themes) and active listings. Accent- and typo-tolerant, and matches
        each record's aliases. At most 5 results per group. Areas without anything
        to book are left out, and listings carry no location.
      parameters:
      - name: q
        in: query
        required: true
        description: At least 2 characters
        schema:
          type: string
      responses:
        '200':
          description: exact name ranks first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_results"
        '422':
          description: query missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
  "/api/v1/session":
    post:
      summary: Sign in with email and password
      tags:
      - Auth
      description: "`role` is the entry point signed in from. Email is unique per
        role, so only that role's account is looked up; an account of another role
        is not found (401)."
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an account made with Google has no password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: unknown role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '429':
          description: too many attempts from one IP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum:
                  - guest
                  - partner
                  - admin
              required:
              - email
              - password
              - role
    delete:
      summary: Sign out (revoke a refresh token)
      tags:
      - Auth
      parameters: []
      responses:
        '204':
          description: an unknown token is ignored
        '422':
          description: token missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/tokens/refresh":
    post:
      summary: Trade a refresh token for new tokens
      tags:
      - Auth
      description: Each refresh token works once. Reusing one revokes every session
        of that user.
      parameters: []
      responses:
        '200':
          description: new tokens; the old refresh token is spent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_tokens"
        '401':
          description: an unknown token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: token given as an array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/webhooks/didit":
    post:
      summary: Didit reports a change to an ID check
      tags:
      - Webhooks
      description: 'Called by Didit, not by the apps. Signed with HMAC-SHA256 of the
        raw body (`X-Signature`, keyed with the destination''s secret) and timestamped
        (`X-Timestamp`, Unix seconds, at most 5 minutes off). The status in the body
        is not trusted: the API reads it back from Didit.'
      parameters:
      - name: X-Signature
        in: header
        schema:
          type: string
      - name: X-Timestamp
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'a check we don''t know (an older session): ignored'
        '502':
          description: 'Didit can''t be asked for the status: Didit retries the delivery'
        '503':
          description: no webhook secret configured
        '401':
          description: no signature
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_type:
                  type: string
                session_id:
                  type: string
                status:
                  type: string
              required:
              - session_id
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    user:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - guest
          - partner
          - admin
        registration_complete:
          type: boolean
          description: False until name and phone are set (PUT /api/v1/me/complete_profile)
      required:
      - id
      - email
      - name
      - phone
      - role
      - registration_complete
    profile_address:
      type: object
      properties:
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
          description: Null where there is none
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2, e.g. PH
      required:
      - street
      - city
      - region
      - province
      - postal_code
      - country
    partner_profile:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          description: Shown to travellers; optional
        legal_first_name:
          type: string
          nullable: true
        legal_last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          description: Read-only here
        address:
          "$ref": "#/components/schemas/profile_address"
        complete:
          type: boolean
          description: True once the profile is saved and a phone is set
      required:
      - display_name
      - legal_first_name
      - legal_last_name
      - phone
      - email
      - address
      - complete
    partner_verification:
      type: object
      properties:
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - in_review
          - approved
          - declined
          - expired
        verified_at:
          type: string
          format: date-time
          nullable: true
        attempts_left:
          type: integer
          description: Declined checks left before an hour's wait (3 at most)
        retry_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the partner must wait before starting another check
      required:
      - status
      - verified_at
      - attempts_left
      - retry_at
    partner_verification_start:
      type: object
      properties:
        url:
          type: string
