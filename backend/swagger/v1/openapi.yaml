---
openapi: 3.0.3
info:
  title: Rent-Anything API
  version: v1
paths:
  "/api/v1/activities":
    get:
      summary: Activities guests can do in bookable areas
      tags:
      - Discovery
      description: Activity tags with the number of bookable areas and published landmarks
        that have them, and of active listings in bookable areas whose category carries
        the tag; most listings first. Activities with no published landmark in a bookable
        area are left out.
      responses:
        '200':
          description: activities with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/activity"
  "/api/v1/admin/bookings":
    parameters:
    - name: Authorization
      in: header
      schema:
        type: string
    get:
      summary: Every partner's bookings, for the team to answer
      tags:
      - Admin
      description: 'Admin-only (RAA-141). The team answers booking requests on partners''
        behalf. `status` picks one status (default `requested`: soonest to expire
        first) or `all` (newest first); at most 200. Each comes with its listing and
        booking type, its partner and business, and its traveller''s contact details.'
      security:
      - bearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - requested
          - accepted
          - awaiting_payment
          - confirmed
          - in_progress
          - completed
          - declined
          - cancelled
          - expired
          - all
      responses:
        '200':
          description: one status
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/admin_booking"
        '422':
          description: a status that doesn't exist
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/admin/bookings/{id}":
    parameters:
    - name: Authorization
      in: header
      schema:
        type: string
    - name: id
      in: path
      schema:
        type: integer
      required: true
    patch:
      summary: Accept or decline a request on its partner's behalf
      tags:
      - Admin
      description: Admin-only (RAA-141). `accepted` takes the guest's payment (a stub
        that pays at once), so it ends confirmed; `declined` frees its days. Recorded
        as the team's answer (actor `admin`), with an optional `reason`. A request
        past its answer-by time has expired, and one already answered can't be answered
        again.
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: declined, with a reason
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/admin_booking"
        '422':
          description: a reason that isn't text
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: no such booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: the booking's own partner, at the admin endpoint
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - accepted
                  - declined
                reason:
                  type: string
                  description: Why, up to 500 characters; kept on the booking's history
              required:
              - status
  "/api/v1/admin/destination_links":
    post:
      summary: Link two destinations
      tags:
      - Admin
      description: Admin-only. Links two areas or landmarks, usually from `GET /api/v1/admin/link_suggestions`.
        Explore then recommends each from the other. The order of the two ends doesn't
        matter, and a pair can only be linked once. `weight` (1 to 3, default 1) orders
        recommendations.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: the link is created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/destination_link"
        '422':
          description: a wrong kind, weight and end type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: no such place
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  "$ref": "#/components/schemas/place_key"
                target:
                  "$ref": "#/components/schemas/place_key"
                kind:
                  type: string
                  enum:
                  - bundled
                  - adjacent
                weight:
                  type: integer
                  minimum: 1
                  maximum: 3
              required:
              - source
              - target
              - kind
  "/api/v1/admin/link_suggestions":
    get:
      summary: Destination links suggested by search picks
      tags:
      - Admin
      description: Admin-only. Pairs of published areas and landmarks that guests
        picked in the same visit, in at least 3 visits over the last 90 days, most
        visits first, at most 50. Pairs already linked are left out. Approve one with
        `POST /api/v1/admin/destination_links`.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: pairs picked together often enough, not yet linked
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/link_suggestion"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/admin/search_term_queue":
    get:
      summary: Searches that need a search term
      tags:
      - Admin
      description: Admin-only. Queries from the last 90 days that found nothing or
        whose results guests rarely picked (under 1 in 5), most searched first, at
        most 50. A query that now matches a name or alias exactly is left out. Add
        one as a search term with `POST /api/v1/admin/search_terms`.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: unanswered and unpicked queries, most searched first
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/search_term_queue_entry"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/admin/search_terms":
    post:
      summary: Add a search term to a place
      tags:
      - Admin
      description: Admin-only. Adds the query as an alias of an area, landmark or
        tag, so the search box finds the place by it once the search index refreshes
        (queued right away). An alias the place already has, in any case or accents,
        is not added twice.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: an alias the place already has is not repeated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_term_target"
        '422':
          description: a missing target
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: no such place
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The search term, 2 to 100 characters
                target:
                  "$ref": "#/components/schemas/place_key"
              required:
              - query
              - target
  "/api/v1/areas":
    get:
      summary: Destinations with something to book
      tags:
      - Discovery
      description: Areas with at least one active listing, most listings first, each
        with its top three activities (by how many published landmarks carry them).
      responses:
        '200':
          description: bookable areas
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/area_card"
  "/api/v1/areas/{slug}":
    get:
      summary: 'A destination: its landmarks and what to book there'
      tags:
      - Discovery
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: a province lists the areas under it that have something to
            book
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/area_detail"
        '404':
          description: unknown area
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/bookings":
    parameters:
    - name: Authorization
      in: header
      schema:
        type: string
    get:
      summary: The guest's bookings
      tags:
      - Bookings
      description: Guest-only (RAA-132). Upcoming bookings (those holding their days,
        pending ones too) first by date, then past, cancelled, declined and expired
        ones, newest first.
      security:
      - bearer: []
      responses:
        '200':
          description: upcoming first, then the rest
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/guest_booking"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/bookings/{id}":
    parameters:
    - name: Authorization
      in: header
      schema:
        type: string
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: One of the guest's bookings, with its history
      tags:
      - Bookings
      description: Guest-only (RAA-132). Another guest's booking is a 404.
      security:
      - bearer: []
      responses:
        '200':
          description: the booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_booking"
        '404':
          description: another guest's booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Change one of the guest's bookings
      tags:
      - Bookings
      description: 'Guest-only (RAA-134). New dates or guests for a booking that holds
        its days and hasn''t started (requested, accepted, awaiting_payment or confirmed);
        a key left out keeps what it has. It is re-priced and checked against the
        calendar, its own days left free to it, and goes back to the partner as a
        request: requested, holding its new days until the partner answers. Its trip
        item takes the same dates and guests.'
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: 'changed: a request again, over days it partly held already'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_booking"
        '422':
          description: guests not a number
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/booking_change_body"
  "/api/v1/bookings/{id}/cancel":
    parameters:
    - name: Authorization
      in: header
      schema:
        type: string
    - name: id
      in: path
      schema:
        type: integer
      required: true
    post:
      summary: Cancel one of the guest's bookings
      tags:
      - Bookings
      description: Guest-only (RAA-132). Cancels a booking that hasn't started, freeing
        its days, with what the guest gets back by the cancellation policy it was
        booked under (refund_if_cancelled_cents said so beforehand). Refunds are recorded
        only until payments are real.
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: 'cancelled within 7 days: no refund'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_booking"
        '422':
          description: already under way
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/booking_cancel_body"
  "/api/v1/checkouts":
    post:
      summary: Book a trip's items
      tags:
      - Bookings
      description: 'Guest-only (RAA-132). Books `item_ids` of one of the guest''s
        trips: each item is re-priced and checked against the calendar as it is now,
        all or nothing. An instant-book listing''s booking is held for payment; a
        request-to-book one''s is a request its partner answers within 24 hours. Both
        hold their days at once. Requests wait for their partner''s answer (RAA-134);
        payment is a stub, so a booking held for payment comes back confirmed. Sending
        the same `idempotency_key` again returns the same checkout.'
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: a stay for more guests than a unit sleeps takes two units
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/checkout"
        '422':
          description: items and key of the wrong shape
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: another guest's trip
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/checkout_body"
  "/api/v1/explore":
    get:
      summary: Listings, nearby destinations and recommendations for a destination
      tags:
      - Discovery
      description: 'One starting point (an area, a published landmark or a map pin)
        and what makes sense for it. Listings are scoped by the kind of place: a province,
        city or island returns what is inside it, a town, landmark or pin what is
        within `km`. Anything on an island is isolated to that island, measured on
        the listing''s exact point. Nearby destinations are areas and landmarks within
        `km` (inside a province). Recommendations are curated destination links: they
        may cross water, never add listings, and are not repeated as nearby destinations.
        Listing locations are rounded to about 1 km.'
      parameters:
      - name: area
        in: query
        required: false
        description: Area slug
        schema:
          type: string
      - name: landmark
        in: query
        required: false
        description: Published landmark slug
        schema:
          type: string
      - name: lat
        in: query
        required: false
        description: Map pin latitude, with lng
        schema:
          type: number
      - name: lng
        in: query
        required: false
        description: Map pin longitude, with lat
        schema:
          type: number
      - name: km
        in: query
        required: false
        description: Radius, 1 to 50 (default 15)
        schema:
          type: number
      responses:
        '200':
          description: 'a pin outside every area: a plain radius'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/explore"
        '404':
          description: a draft landmark
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: values out of range or not numbers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
  "/api/v1/health":
    get:
      summary: Liveness and database check
      tags:
      - Health
      responses:
        '200':
          description: the API and its database answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  postgis:
                    type: string
                required:
                - status
                - postgis
  "/api/v1/landmarks":
    get:
      summary: Published landmarks with their location
      tags:
      - Discovery
      description: 'Every published landmark, by name, with its exact location: landmarks
        are public places.'
      responses:
        '200':
          description: published landmarks
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/landmark_pin"
  "/api/v1/listings":
    get:
      summary: Active listings with their approximate location
      tags:
      - Discovery
      description: Every active listing, by title, with its location rounded to two
        decimals (about 1 km). The exact point is revealed only after a paid booking.
      responses:
        '200':
          description: a priced stay's pin carries its nightly price
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/listing_pin"
  "/api/v1/listings/{id}":
    get:
      summary: One active listing, as a traveller sees it
      tags:
      - Discovery
      description: 'An active listing''s description, category, area, business and
        number of units. Never its location or address: the exact point is revealed
        only after a paid booking. Draft, paused and delisted listings are a 404.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: a stay with no price yet, and a listing that isn't priced by
            the night
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/listing_detail"
        '404':
          description: an unknown listing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/me/complete_profile":
    put:
      summary: Finish sign-up with a name and phone
      tags:
      - Auth
      description: Sign-up asks only for email and password; the web app sends a user
        whose `registration_complete` is false here before anything else. Both fields
        are required. Guests and partners alike.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a partner completes theirs
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone with no digits
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  description: Digits, spaces, ( ) - and a leading +; 7 to 15 digits
              required:
              - name
              - phone
  "/api/v1/me/profile":
    get:
      summary: The signed-in guest's profile
      tags:
      - Auth
      description: Guest-only (a partner's is /api/v1/partner/profile). Fields are
        null until the profile is first saved; `complete` drives the web app's banner.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a saved profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_profile"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Save the signed-in guest's profile
      tags:
      - Auth
      description: Guest-only. Every field is required except `address.province`;
        `phone` is saved on the user. Email can't be changed here.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a display name and an email are ignored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/guest_profile"
        '422':
          description: a phone that isn't a phone number saves nothing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '403':
          description: a partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_first_name:
                  type: string
                legal_last_name:
                  type: string
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    province:
                      type: string
                      nullable: true
                      description: 'Optional: none in Metro Manila'
                    postal_code:
                      type: string
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2, e.g. PH
                  required:
                  - street
                  - city
                  - region
                  - postal_code
                  - country
              required:
              - legal_first_name
              - legal_last_name
              - phone
              - address
  "/api/v1/me":
    get:
      summary: The signed-in user
      tags:
      - Auth
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: the user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '401':
          description: an expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Edit the signed-in user's profile
      tags:
      - Auth
      description: Only `name` and `phone`; keys left out are unchanged. A blank or
        null `phone` clears it.
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: a blank phone clears it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user"
        '422':
          description: phone given as a number
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
