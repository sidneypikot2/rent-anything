                  "$ref": "#/components/schemas/payout_account"
        '403':
          description: a guest
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Add a payout account
      tags:
      - Partner
      description: Partner-only. `kind`, `account_name` and `account_number` are required,
        and `bank_code` for a bank account (the banks are in payout options). A bank
        account number is 6 to 20 digits; an e-wallet's is a Philippine mobile number.
        The number is stored encrypted.
      security:
      - bearer: []
